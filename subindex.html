<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subtítulos en vivo</title>
<style>
:root{--fg:#e6e6e6;--fs:30px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;color:var(--fg);font-family:Georgia,serif;overflow:hidden}
#setup{padding:24px;max-width:520px;margin:auto}h1{font-size:22px}p{font-size:15px;line-height:1.5;opacity:.75}
button,select{background:#161616;color:var(--fg);border:1px solid #444;border-radius:10px;padding:12px 16px;font-size:16px;margin:4px 4px 4px 0}
button:disabled{opacity:.35}
#live{display:none;height:100%;flex-direction:column}
#bar,#bar2{display:flex;gap:5px;padding:4px 6px;align-items:center}#bar button,#bar2 button{padding:9px 11px;font-size:14px;margin:0}#spd{font-size:12px;opacity:.7;min-width:62px;text-align:center}
#pos{flex:1;text-align:center;font-size:12px;opacity:.5;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 18px;gap:16px;position:relative}
.l{font-size:calc(var(--fs)*.68);opacity:.38;line-height:1.3}.cur{font-size:var(--fs);line-height:1.25;font-weight:bold}
.who{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:4px}
#tap{position:absolute;inset:0;display:flex}#tap div{flex:1}
#heard{font-size:14px;opacity:.8;padding:8px 12px;min-height:40px;font-family:monospace;border-top:1px solid #222}
</style></head><body>
<div id="setup"><h1>Subtítulos en vivo</h1>
<p>1. Carga el guion (oliver_script.json). Se guarda solo en este móvil.</p>
<button id="load">Cargar guion</button><input id="file" type="file" accept=".json,.txt" hidden>
<p id="st"></p>
<p>2. Idioma de la obra<br><select id="lang"><option value="en-GB">Inglés (UK)</option><option value="en-US">Inglés (US)</option></select></p>
<p>3. Brillo al mínimo y móvil en silencio.</p>
<button id="go" disabled>Empezar</button></div>
<div id="live">
<div id="bar"><button id="mic">🎤</button><button id="auto">▶ auto</button><button id="sm">−</button><span id="spd"></span><button id="sp">+</button><button id="pv">⏮</button><button id="nx">⏭</button></div>
<div id="bar2"><button id="jump">Ir a…</button><button id="fm">A−</button><button id="fp">A+</button><button id="col">●</button><span id="pos"></span><button id="exit">✕</button></div>
<div id="stage"><div class="l" id="p2"></div><div class="l" id="p1"></div><div><div class="who" id="who"></div><div class="cur" id="cur"></div></div><div class="l" id="n1"></div><div class="l" id="n2"></div>
<div id="tap"><div id="back"></div><div id="fwd"></div></div></div>
<div id="heard">Esperando voz…</div></div>
<script>
const $=id=>document.getElementById(id);
let L=[],SW=[],SL=[],IX={},cur=0,rec=null,micOn=false,wake=null,fs=30,ci=0,pend=-1,diag='',auto=false,tmr=null,wps=2;
const COLS=['#e6e6e6','#ffb347','#ff5a4d','#6bff8a'];
/*PURE*/
const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]+/g,' ').replace(/'/g,'').split(/\s+/).filter(Boolean);
const kc={};function key(w){return kc[w]||(kc[w]=w.replace(/ph/g,'f').replace(/ck|c(?![eiy])/g,'k').replace(/[aeiouy]+/g,(m,o)=>o?'':m[0]).replace(/(.)\1+/g,'$1'))}
function lev1(a,b){if(a.length<b.length)[a,b]=[b,a];let i=0;while(i<b.length&&a[i]===b[i])i++;if(a.length===b.length)return a.slice(i+1)===b.slice(i+1);return a.slice(i+1)===b.slice(i)}
function eq(a,b){if(a===b)return true;if(a.length<4||b.length<4)return false;if(key(a)===key(b))return true;return a.length>=5&&Math.abs(a.length-b.length)<=1&&lev1(a,b)}
function build(d){L=[];SW=[];SL=[];IX={};let who='',head='';d.forEach(([k,t])=>{if(k==='s')who=t;else if(k==='h')head=t;else{const w=norm(t);L.push({t,who,head,n:w.length});w.forEach(x=>{SW.push(x);SL.push(L.length-1)})}});SW.forEach((x,p)=>{const k=key(x);(IX[k]=IX[k]||[]).push(p)})}
const idf=w=>Math.log(1+SW.length/((IX[key(w)]||[]).length||1));
function align(tail,s){let j=Math.max(0,s),sc=0,tot=0,last=-1,h=0;for(const t of tail){const wt=idf(t);tot+=wt;let f=-1;for(let k=j;k<j+4&&k<SW.length;k++)if(eq(t,SW[k])){f=k;break}if(f>=0){sc+=wt;j=f+1;last=f;h++}else j++}return{s:tot?sc/tot:0,last,h}}
function locate(text){const tail=norm(text).slice(-8);if(tail.length<2)return null;const st=new Set();tail.forEach((t,i)=>{if(t.length<3)return;(IX[key(t)]||[]).slice(0,200).forEach(p=>st.add(p-i))});let best=null;st.forEach(s=>{const r=align(tail,s);if(r.last<0)return;const ln=SL[r.last];const v=r.s*(ln>=cur-1&&ln<=cur+8?1.25:1);if(!best||v>best.v)best={v,ln,s:r.s,h:r.h}});return best}
function onHeard(text){const b=locate(text);diag=b?' \u2192 #'+(b.ln+1)+' ('+b.s.toFixed(2)+', '+b.h+' pal.)':' \u2192 sin coincidencia';if(!b||b.s<.5||b.h<2)return;const near=b.ln>=cur-1&&b.ln<=cur+8;if(near||(b.s>=.85&&b.h>=4)){go(b.ln);pend=-1;return}if(pend>=0&&Math.abs(b.ln-pend)<=3){go(b.ln);pend=-1}else pend=b.ln}
function go(i){if(i!==cur){cur=i;show();sched()}}
/*END*/
const pretty=t=>(t===t.toUpperCase()?t.charAt(0)+t.slice(1).toLowerCase():t).replace(/\bi\b/g,'I').replace(/\bi'/g,"I'");
function show(){const g=i=>L[i]?pretty(L[i].t):'';$('p2').textContent=g(cur-2);$('p1').textContent=g(cur-1);$('cur').textContent=g(cur);$('who').textContent=L[cur]?L[cur].who:'';$('n1').textContent=g(cur+1);$('n2').textContent=g(cur+2);$('pos').textContent=(L[cur]?L[cur].head:'')+' \u00b7 '+(cur+1)+'/'+L.length}
function st(k,v){try{localStorage.setItem(k,v)}catch(e){}}function ld(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ready(){$('st').textContent=L.length+' l\u00edneas cargadas.';$('go').disabled=!L.length}
function parseTxt(s){try{const d=JSON.parse(s);if(Array.isArray(d))return d}catch(e){}return s.split('\n').filter(x=>x.trim()).map(x=>['l',x.trim()])}
function applyUI(){document.documentElement.style.setProperty('--fg',COLS[ci]);document.documentElement.style.setProperty('--fs',fs+'px')}
$('load').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const s=await f.text();build(parseTxt(s));st('script',s);ready()};
const sv=ld('script');if(sv){build(parseTxt(sv));ready()}
ci=+(ld('ci')||0)%COLS.length;fs=+(ld('fs')||30);applyUI();
function startRec(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('heard').textContent='Este navegador no soporta reconocimiento de voz. Usa Chrome (Android) o Safari (iPhone). Puedes avanzar tocando la pantalla.';return}
rec=new R();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=true;
rec.onstart=()=>{$('mic').textContent='\ud83c\udfa4 on';$('heard').textContent='Escuchando\u2026'};
rec.onresult=e=>{const r=e.results;let t=r[r.length-1][0].transcript;if(norm(t).length<5&&r.length>1)t=r[r.length-2][0].transcript+' '+t;onHeard(t);$('heard').textContent='O\u00ed: '+t.trim().slice(-70)+diag};
rec.onend=()=>{if(micOn)setTimeout(()=>{try{rec.start()}catch(e){}},300)};
rec.onerror=e=>{const m={'not-allowed':'Micr\u00f3fono BLOQUEADO: abre la p\u00e1gina en Chrome/Safari con https y acepta el permiso.','service-not-allowed':'El navegador no permite reconocimiento de voz aqu\u00ed.','no-speech':'No oigo nada: sube el volumen o acerca el m\u00f3vil.','audio-capture':'No encuentro micr\u00f3fono.','network':'Sin internet: el reconocimiento de voz lo necesita.'};if(e.error==='not-allowed'||e.error==='service-not-allowed'){micOn=false;$('mic').textContent='\ud83c\udfa4 error'}if(e.error!=='aborted')$('heard').textContent=m[e.error]||('Error de mic: '+e.error)};
try{rec.start()}catch(e){}}
wps=+(ld('wps')||2);
function sched(){clearTimeout(tmr);if(!auto)return;const d=Math.max(1500,(L[cur]?L[cur].n:3)/wps*1000);tmr=setTimeout(()=>{if(cur<L.length-1)go(cur+1);else{auto=false;$('auto').textContent='\u25b6 auto'}},d)}
function spd(){$('spd').textContent=wps.toFixed(1)+' pal/s'}
function heads(){const hs=[];L.forEach((l,i)=>{if(!hs.length||hs[hs.length-1][0]!==l.head)hs.push([l.head,i])});return hs}
$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'\u23f8 auto':'\u25b6 auto';sched()};
$('sm').onclick=()=>{wps=Math.max(.8,+(wps-.3).toFixed(1));st('wps',wps);spd();sched()};$('sp').onclick=()=>{wps=Math.min(5,+(wps+.3).toFixed(1));st('wps',wps);spd();sched()};
$('nx').onclick=()=>{const n=heads().find(x=>x[1]>cur);if(n)go(n[1])};
$('pv').onclick=()=>{const hs=heads();let k=0;hs.forEach((x,i)=>{if(x[1]<=cur)k=i});go(hs[k][1]<cur?hs[k][1]:hs[Math.max(0,k-1)][1])};
spd();
$('go').onclick=async()=>{$('setup').style.display='none';$('live').style.display='flex';show();micOn=true;startRec();try{wake=await navigator.wakeLock.request('screen')}catch(e){}};
$('mic').onclick=()=>{micOn=!micOn;$('mic').textContent=micOn?'\ud83c\udfa4 on':'\ud83c\udfa4 off';if(micOn)startRec();else if(rec)rec.stop()};
$('exit').onclick=()=>{micOn=false;if(rec)rec.stop();try{wake&&wake.release()}catch(e){}$('live').style.display='none';$('setup').style.display='block'};
$('col').onclick=()=>{ci=(ci+1)%COLS.length;st('ci',ci);applyUI()};
$('fp').onclick=()=>{fs=Math.min(60,fs+4);st('fs',fs);applyUI()};$('fm').onclick=()=>{fs=Math.max(18,fs-4);st('fs',fs);applyUI()};
$('fwd').onclick=()=>{go(Math.min(L.length-1,cur+1))};$('back').onclick=()=>{go(Math.max(0,cur-1))};
$('jump').onclick=()=>{const hs=heads();const n=parseInt(prompt('N\u00famero de escena/canci\u00f3n:\n'+hs.map((h,i)=>(i+1)+'. '+h[0]).join('\n')),10);if(n&&hs[n-1])go(hs[n-1][1])};
</script></body></html>
